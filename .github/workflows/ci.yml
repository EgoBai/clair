name: CI

# 质量门禁 — 与实际架构(Cloudflare Pages + GitHub Pages)对齐的精简CI
# 部署由 deploy-worker.yml(Worker) 和 deploy.yml(GitHub Pages) 独立承担
# 本工作流只做快速稳定的代码质量检查: lint + typecheck + build
# (已移除 docker-compose 自托管时代的遗留 ci-cd.yml)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 后端: 安装 + lint + **构建 Docker 镜像用的那份产物**
      # 旧注释说「后端用 tsx 运行, 无独立 build 步骤」——这句是错的，会误导后来者：
      # backend/package.json 有 build:prod（esbuild 打成 dist/server.cjs），
      # 而 backend/Dockerfile:70 正是用 `npm run build:prod` 产出上线镜像的。
      # 于是 CI 不跑它 ⟹ 打包环节一旦坏（esbuild 解析不到新依赖、format 冲突等），
      # CI 依旧全绿，直到 deploy-backend 构建镜像时才炸。补上这一步，0.6s，无 OOM 风险。
      - name: Backend - install, lint & build:prod
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm run build:prod

      # 前端: 安装 + lint + 构建(tsc 类型检查 + vite 构建)
      # ⚠️ 必须带 `--mode github`：vite.config.ts:101 是
      #   `base: mode === 'github' ? '/clair/' : '/'`
      # 也就是说**真正上线的那份**（GitHub Pages 子路径 /clair/）只在 --mode github 下构建。
      # 原来这里跑 `npm run build`（= tsc && vite build，mode 默认 production）⟹
      # PR 上验证的一直是 base='/' 的另一个变体，线上那份从未被 PR 校验过；
      # 一旦 /clair/ 子路径下的资源引用坏掉，CI 依然绿 —— 正是「看绿就以为没事」的坑。
      # 这里与 deploy.yml 的 `npx tsc && npx vite build --mode github` 保持**同一条命令**。
      # 刻意用 npx 直调而不走 `npm run build`：后者的 prebuild 钩子会把 dist 挪去 /tmp
      # （CI 是干净 checkout，这一挪纯属多余），deploy.yml 也是直调。
      - name: Frontend - install, lint & build (mode=github)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npx tsc
          npx vite build --mode github
        # 后端地址取单一真源：GitHub Actions 仓库 Variables 的 VITE_API_BASE。
        #
        # ⚠️ 这里**刻意不写硬编码兜底值**（历史上写过 `vars.VITE_API_BASE || 'https://clair-api.pages.dev'`）。
        # 教训来自两处同步的默认值：main.tsx 的运行时兜底 与 deploy.yml 的 `vars.X || '<url>'`
        # 各写一份，漏改任一处都**不报错**，只会让前端静默指向错误后端 ——
        # 而「后端换域名」恰恰是所有变更里最容易漏改的那一次。
        # 变量未配时，vite.config.ts 的构建期守卫会**显式失败**（报错信息直接指明三处注入方式），
        # 诚实失败优于静默指向错误后端。
        # 与 deploy.yml:40 保持同一写法，不再出现第二份地址。
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      # 前端质量门禁: UI 守卫(静态 AST + 数据基线扫描)
      # 发现 ERROR 级问题时进程非零退出，使 CI 失败
      - name: Frontend - UI guard
        working-directory: frontend
        run: npm run guard

  # ---------------------------------------------------------------
  # 单元测试 (阻断级)
  # - 独立 job 而非并入 quality: 使 vitest 失败可单独归因, 且与 quality 并行。
  # - 已转真阻断 (R0'-2.2): job 级 continue-on-error 已摘除, vitest 失败即
  #   使本 job 失败, 从而真正拦截合并。刻意不放宽任何断言、不加 `|| true`,
  #   要的是真实失败暴露。
  #   已知风险(事前已告知并获确认): 两个测试套在 CI 环境的通过率此前没有基线,
  #   故转入阻断后的首次 CI 可能直接变红 —— 这是预期行为, 不是故障。
  # - 用 `npx vitest run` 显式进入 run 模式。
  #   【更正 2026-11-03】旧注释写「前端 package.json 的 test 脚本是裸 `vitest`(watch 模式),
  #   在 CI 会挂住不退出」——这句与事实不符：backend/frontend 的 test 都是 `vitest run`，
  #   两个 `test:watch` 才是裸 `vitest`。因此 `npm test` 在 CI 里**不会**挂住。
  #   保留显式 `npx vitest run` 的理由改为可归因性：它写明了"跑一次就退"，不依赖
  #   package.json 里的间接定义，将来谁把 test 改回 watch 模式也不会把 CI 拖成超时。
  #   命令与 `npm test` 等价（都走 vitest run），不是"另一套跑法"。
  # ---------------------------------------------------------------
  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install & test
        working-directory: backend
        run: |
          npm ci
          npx vitest run --retry=2

      - name: Frontend - install & test
        working-directory: frontend
        run: |
          npm ci
          npx vitest run --retry=2

  # --retry=2 说明（2026-10-16，用户要求根治"push 后反复收失败邮件"）：
  # CI 共享 runner 的真实时间断言/端口竞态类测试存在环境抖动，单次运行
  # 会随机红（实例：virtualScrollEngine 缓存基准 2.69ms > 1.88ms 阈值）。
  # --retry=2 只重试失败用例最多 2 次：环境抖动重试后转绿；真实回归
  # 3 连红依旧失败 —— R0'-2.2 的阻断语义不变（continue-on-error 仍然禁止，
  # 见 scripts/guard/README.md §4.4）。已知的确定性断言缺陷另行修复，
  # 不依赖 retry 掩盖（本次同批修 virtualScrollEngine）。

  # ---------------------------------------------------------------
  # 诚实红线门禁 (阻断级)
  # - 零依赖, 故无需安装: scripts/guard/honesty-scan.mjs 为纯 Node ESM 脚本,
  #   只用内置 node:fs / node:path / node:url, 直接以 node 执行即可,
  #   刻意不做 npm ci / npm install。
  # - 传 --strict: 当前未豁免 RED 与过期豁免均为 0, 故今天不会红;
  #   一旦有人引入新的未豁免违规或 allowlist 条目到期, 本 job 立即失败。
  #   失败时会打印 路径:行 + 行内容 + 判定原因 到 CI 日志(见脚本 main())。
  # - 已转真阻断 (R0'-2.2): job 级 continue-on-error 已摘除。
  #   注意: continue-on-error 会让分支保护恒见绿勾, 从而"看似有门禁、实则拦不住";
  #   此坑已记录在 scripts/guard/README.md §4.4, 请勿加回。
  # ---------------------------------------------------------------
  honesty-guard:
    name: Honesty red-line guard (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Honesty scan (zero-dependency, --strict)
        run: node scripts/guard/honesty-scan.mjs --strict

  # ---------------------------------------------------------------
  # 影子测试守卫: 只统计、不安装依赖, 与基线比数量。
  # 口径见 docs/harness/SHADOW-TEST-CENSUS.md:
  #   测试文件不 import 任何产品代码 = 断言的是自抄实现, 产品改坏它不会红。
  # 规则: 数量只许降不许升（基线 scripts/guard/shadow-baseline.json）。
  # 迁移一批后手动下调基线, 不允许用删测试冲抵。
  # ---------------------------------------------------------------
  shadow-test-guard:
    name: Shadow test guard (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Shadow test census (fail if ratio rises)
        run: node scripts/guard/shadow-test-census.mjs --check

  # ---------------------------------------------------------------
  # E2E 冒烟 (观察期: job 级 continue-on-error, 失败可见但不阻断合并)
  # - 此前 frontend/e2e 下两个 spec（route-render-smoke / stock-app）从未被执行:
  #   没有 npm script、没有 CI job —— 等于「有测试文件, 无测试」。
  #   本次补 e2e npm script（frontend/package.json + 根 package.json）并接入 CI。
  # - 只跑 chromium: mobile-chrome 项目留本地/后续夜间跑, 先压住观察期时长。
  # - 不依赖后端: 诚实空态用例 frontend/e2e/honest-empty-states.spec.ts 用
  #   context.route 接管 /api/lockup/calendar, 断言「取不到数据 ≠ 没有数据, 也不显示 0 值统计卡」;
  #   路由渲染冒烟只要求布局/路由挂载, 不要求真实行情。
  #   CI 无后端时 /api 经 vite proxy 失败, 由页面既有降级路径承接 —— 正是本 job 要盯的行为。
  # - continue-on-error 的语义: 失败不拦截合并, 但 job 显示红叉而不是伪装成绿。
  #   与 unit-tests / honesty-guard 的「阻断」刻意不同: e2e 要先积累真实通行数据。
  #   转阻断的前置条件(Lead 复盘时定, 不在本 PR 内切换):
  #     (1) 观察期内无 flaky 用例, 或已修复并注明;
  #     (2) honest-empty-states 的三条降级断言连续 3-5 次 CI 全绿;
  #     (3) route-render-smoke 不再依赖后端真实数据。
  # ---------------------------------------------------------------
  e2e-smoke:
    name: E2E smoke (playwright, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - install
        working-directory: frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E - chromium
        working-directory: frontend
        # webServer 由 playwright.config.ts 自己起 vite dev（CI 里 reuseExistingServer=false）。
        run: npx playwright test --project=chromium

      - name: Upload playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
