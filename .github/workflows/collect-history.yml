name: Collect Sector History

# 每个交易日收盘后采集板块历史，为多维矩阵 v3-lite 积累 KV 数据底座
# Cloudflare Pages Functions 不支持原生 cron，由本工作流调用 HTTP 端点代替
on:
  schedule:
    - cron: '30 7 * * 1-5'  # UTC 07:30 = 北京时间 15:30（收盘后）
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger collect-history
        run: |
          set -euo pipefail
          # ⚠️ 这个 URL **必须继续打 Cloudflare Worker（clair-api.pages.dev）**，不要因为
          #    主 API 切换到 Render 就顺手改成 Render 域名 —— 改了会静默 404。
          #
          #    原因（2026-10-26 实读核实）：
          #      · `/api/cron/collect-history` 是 **Worker 专属端点**
          #        （clair-worker/worker.js:4535 `if (path === '/api/cron/collect-history')`），
          #        它把结果写进 **KV(STOCK_DATA)** 积累板块 K 线与板块 PE 中位数历史
          #        （同文件 worker.js:3782 注释印证）。
          #      · **Express 后端完全没有该路由**：`rg "collect-history" backend/src` 零命中。
          #    因此改指 Render 域名 = 打到一个不存在的路由；而本 cron 是无人值守的
          #    schedule（每交易日 UTC 07:30），失败不会立刻有人发现 —— 属典型的静默缺陷。
          #
          #    将来若要在 Render 侧承接：先在 Express 实现同名端点，并决定 KV 里已积累的
          #    历史数据如何迁移/替代，两者都落地后再改这里。
          TOKEN="${{ secrets.CRON_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            URL="https://clair-api.pages.dev/api/cron/collect-history?token=${TOKEN}"
          else
            URL="https://clair-api.pages.dev/api/cron/collect-history"
          fi
          code=$(curl -sS -o /tmp/collect.json -w "%{http_code}" --max-time 240 "$URL")
          echo "HTTP $code"
          cat /tmp/collect.json | head -c 2000; echo
          [ "$code" = "200" ] || { echo "::warning::collect-history 返回 $code，请检查 Worker 部署状态"; exit 1; }
