name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc && npx vite build --mode github
        env:
          # 主理人修正（2026-10-06）：移除 `|| 'https://clair-api.pages.dev'` 兜底。
          # 该兜底是一条**后门**：GitHub variable 缺失时构建不会失败，而是静默回落
          # 到 Cloudflare Worker —— 而 Worker 只实现了约 24 条硬编码路由，
          # 其 /health 自报 service=clair-worker，并非 backend/ 这份代码。
          # 后果是「构建成功、部署成功、页面却连错了后端」，且没有任何报错。
          # 移除后，缺失配置会由 frontend/src/main.tsx 的构建期守卫拦下（非 0 退出）。
          # 详见 frontend/src/main.tsx 与 .env.example。
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
