apiVersion: v1
kind: ConfigMap
metadata:
  name: astock-grafana-datasources
  namespace: monitoring
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: astock-grafana-dashboards
  namespace: monitoring
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'A-Stock'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
  astock-overview.json: |
    {
      "dashboard": {
        "title": "A股行情分析 - 系统概览",
        "uid": "astock-overview",
        "panels": [
          {
            "title": "请求速率 (QPS)",
            "type": "graph",
            "targets": [{"expr": "rate(http_requests_total[5m])"}],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "title": "响应时间 P99",
            "type": "graph",
            "targets": [{"expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))"}],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "title": "错误率",
            "type": "graph",
            "targets": [{"expr": "rate(http_requests_total{status=~\"5..\"}[5m]) / rate(http_requests_total[5m])"}],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "title": "活跃 WebSocket 连接",
            "type": "gauge",
            "targets": [{"expr": "websocket_connections_active"}],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "title": "数据库连接池",
            "type": "gauge",
            "targets": [{"expr": "db_connections_active"}],
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16}
          },
          {
            "title": "内存使用",
            "type": "graph",
            "targets": [{"expr": "process_resident_memory_bytes"}],
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16}
          },
          {
            "title": "CPU 使用率",
            "type": "graph",
            "targets": [{"expr": "rate(process_cpu_seconds_total[5m])"}],
            "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16}
          }
        ]
      }
    }
