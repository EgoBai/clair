# Nginx 蓝绿部署配置
# 通过变量切换后端版本

# 默认指向蓝色环境
upstream backend_blue {
    server backend-blue:3001;
}

upstream backend_green {
    server backend-green:3001;
}

map $cookie_deployment $backend_target {
    default  backend_blue;
    blue     backend_blue;
    green    backend_green;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 路由 - 根据 cookie 切换后端
    location /api/ {
        proxy_pass http://$backend_target;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Deployment-Target $backend_target;
    }

    location /ws {
        proxy_pass http://backend_blue;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # 切换版本的管理接口
    location /deploy/switch {
        internal;
        # 生产环境中需要认证
        # auth_basic "Deployment";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        return 200 '{"status": "switched"}';
    }

    # 蓝色环境健康检查
    location /health/blue {
        proxy_pass http://backend_blue/health;
        access_log off;
    }

    # 绿色环境健康检查
    location /health/green {
        proxy_pass http://backend_green/health;
        access_log off;
    }

    # 默认健康检查（蓝色）
    location /health {
        proxy_pass http://backend_blue/health;
        access_log off;
    }
}
