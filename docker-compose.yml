version: '3.8'

services:
  # ===== PostgreSQL 16 Database =====
  postgres:
    image: postgres:16-alpine
    container_name: astock-postgres
    environment:
      POSTGRES_DB: astock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astock_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Redis 7 Cache =====
  redis:
    image: redis:7-alpine
    container_name: astock-redis
    command: redis-server --appendonly yes --lazyfree-lazy-eviction yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== Backend API Service =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astock-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-astock_secret}@postgres:5432/astock
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: astock:
      TZ: Asia/Shanghai
    ports:
      - "4000:4000"
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ===== Frontend SPA Service =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astock-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    container_name: astock-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - stock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  stock-network:
    driver: bridge
